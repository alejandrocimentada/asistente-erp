  - {title: "SAP Help (S/4HANA Cloud Best Practices): Consumable Purchasing (Manage Purchase Orders F0842A)", url: "https://help.sap.com/docs/SAP_S4HANA_CLOUD_BEST_PRACTICES/f09d278d3472a69eb576f1ed768b35a1/f5c1199f35244f83b353f48af2e7625c.html"}
