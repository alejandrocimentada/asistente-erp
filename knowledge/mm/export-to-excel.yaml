  - {title: "SAP Help (SAP GUI 2023): Export to Local File", url: "https://help.sap.com/docs/ABAP_PLATFORM_NEW/b1c834a22d05483b8a75710743b5ff26/4d6204f5d79751b0e10000000a42189c.html"}
  - {title: "SAP Help (SAP GUI 2023 FPS02): Exporting Lists", url: "https://help.sap.com/docs/ABAP_PLATFORM_NEW/b1c834a22d05483b8a75710743b5ff26/4d61420d95fe30afe10000000a42189b.html"}
