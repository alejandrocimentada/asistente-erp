  - {title: "SAP Help (S/4HANA on-premise): Purging and Precompacting of Material Document Data (MIGO, MB51, MATDOC)", url: "https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/677f0a4e71d7487ebb70683014761789/7a29ed568b0c41828a4e2c8da9ae1082.html"}
  - {title: "SAP Support Content: New Simplified Data Model (NSDM) for Inventory Management Tables", url: "https://help.sap.com/docs/SUPPORT_CONTENT/erpscm/3362167285.html"}
