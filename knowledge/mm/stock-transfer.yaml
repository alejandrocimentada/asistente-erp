id: stock-transfer
module: MM
area: movimientos
names:
  es: Traspasar stock entre almacenes o centros (traspaso)
  en: Transfer posting / stock transfer
tcode: MIGO
related_tcodes: [MB51, MMBE, ME21N]
keywords:
  es: [traspaso, traspasar, transferir stock, mover stock, mover mercancia, cambiar de almacen, de un almacen a otro, de una tienda a otra, traslado, 311, 301, liberar stock bloqueado, pasar stock, pasar de un almacen a otro]
  en: [transfer posting, stock transfer, move stock, storage location to storage location, plant to plant, movement type 311, movement type 301, transfer]
summary: >-
  Mueve stock de un almacén a otro dentro del mismo centro (311) o de un centro a otro sin
  pedido (301 en un paso, o 303/305 en dos pasos). Si el traslado entre centros necesita
  planificación, transporte o factura, se usa un pedido de traslado (ver "stock-transport-order").
s4hana_notes: >-
  MIGO es la transacción en ECC y S/4HANA; en S/4HANA las antiguas MB1B y similares ya no se
  usan. Apps Fiori: "Transfer Stock - In-Plant" (F1061) dentro del mismo centro y
  "Transfer Stock - Cross Plant" (F1957) entre centros.
fiori_app:
  name: Transfer Stock - In-Plant
  id: F1061
  note: Entre centros se usa Transfer Stock - Cross Plant (F1957).
steps:
  - Escribe MIGO y presiona Enter.
  - "En la primera lista elige Traspaso (Transfer Posting); en la segunda, Otros (Other)."
  - "Escribe la clase de movimiento: 311 = de almacén a almacén en el mismo centro; 301 = de un centro a otro en un paso."
  - "En la posición, pestaña de origen (From): Material, Centro y Almacén de donde sale. En la pestaña de destino (To): Centro y Almacén a donde va."
  - Escribe la Cantidad y marca Posición OK (Item OK).
  - Presiona Verificar (Check) y luego Contabilizar (Post).
  - Revisa el resultado en MMBE o MB51.
key_fields:
  - {label: Clase de movimiento (Movement Type), technical: BWART, meaning: "311 almacén→almacén; 301 centro→centro en un paso; 303/305 centro→centro en dos pasos; 313/315 almacén→almacén en dos pasos."}
  - {label: Almacén origen y destino, technical: LGORT, meaning: De dónde sale y a dónde llega.}
  - {label: Centro origen y destino, technical: WERKS, meaning: Para traspasos entre centros.}
tables:
  - {name: MKPF, description: "ECC: cabecera del documento material."}
  - {name: MSEG, description: "ECC: posiciones del documento material."}
  - {name: MATDOC, description: "S/4HANA: documento material."}
  - {name: MARD, description: Stock por almacén.}
common_errors:
  - error: "M7021: Deficit of … (falta de stock)."
    meaning: No hay suficiente stock de libre utilización en el almacén de origen.
    what_to_do: Revisa el stock en MMBE (puede estar bloqueado o en control de calidad) y ajusta la cantidad.
    verified: true
  - error: El material no está creado en el almacén de destino.
    meaning: El material no tiene datos en ese almacén.
    what_to_do: En muchas empresas SAP los crea solo; si no, pídelo al equipo de datos maestros.
    verified: false
verification:
  status: verificado
  sin_verificar:
    - Nombres exactos de las listas desplegables de MIGO en español.
    - "Que el almacén de destino se cree automáticamente: depende de la configuración de cada empresa."
sources:
