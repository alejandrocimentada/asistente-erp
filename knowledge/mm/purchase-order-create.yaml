id: purchase-order-create
module: MM
area: compras
names:
  es: Crear una orden de compra (pedido de compras)
  en: Create purchase order
tcode: ME21N
related_tcodes: [ME22N, ME23N, ME51N, MIGO]
keywords:
  es: [crear orden de compra, orden de compra, nueva orden de compra, crear pedido, pedido de compras, pedido a proveedor, comprar, hacer una compra, emitir orden de compra, oc]
  en: [create purchase order, purchase order, new po, create po, order from supplier, order from vendor, buy]
summary: >-
  Crea un pedido de compras (lo que muchas empresas llaman "orden de compra"): a qué
  proveedor, qué material, cuánto, a qué precio, cuándo y a qué centro se entrega. En SAP en
  español suele llamarse "pedido".
s4hana_notes: >-
  ME21N existe en ECC y en S/4HANA (en Fiori aparece como la app "Create Purchase Order -
  Advanced (ME21N)"). La app Fiori nativa es "Manage Purchase Orders" (F0842A). En S/4HANA el
  proveedor (vendor) se llama "supplier" y se mantiene como Business Partner (transacción BP).
  La versión antigua ME21 fue reemplazada por ME21N.
fiori_app:
  name: Manage Purchase Orders
  id: F0842A
  note: Crear, cambiar y revisar pedidos desde Fiori. "Create Purchase Order - Advanced" abre ME21N dentro de Fiori.
steps:
  - Escribe ME21N y presiona Enter.
  - Arriba a la izquierda elige la Clase de pedido (Order Type). NB es el pedido estándar; tu empresa puede tener otras.
  - Escribe el Proveedor (Vendor/Supplier) y presiona Enter.
  - "En la cabecera, pestaña de datos organizativos, revisa Organización de compras (Purchasing Org.), Grupo de compras (Purchasing Group) y Sociedad (Company Code)."
  - "En la tabla de posiciones, por cada renglón escribe Material, Cantidad (PO Quantity), Fecha de entrega (Delivery Date), Centro (Plant) y, si aplica, Almacén (Storage Location). El precio suele venir del registro info o contrato; si no, escríbelo."
  - Presiona Verificar (Check) para ver si falta algo. Corrige los mensajes en rojo.
  - Guarda (Ctrl+S). SAP muestra el número del pedido creado; anótalo.
  - "Si tu empresa usa aprobaciones (liberación), el pedido queda esperando aprobación antes de enviarse al proveedor."
key_fields:
  - {label: Clase de pedido (Order Type), technical: EKKO-BSART, meaning: "Tipo de documento: NB estándar, UB traslado entre centros, u otros propios de la empresa."}
  - {label: Proveedor (Vendor/Supplier), technical: EKKO-LIFNR, meaning: A quién le compras.}
  - {label: Organización de compras (Purchasing Org.), technical: EKKO-EKORG, meaning: Unidad que negocia las compras.}
  - {label: Grupo de compras (Purchasing Group), technical: EKKO-EKGRP, meaning: Comprador o equipo responsable.}
  - {label: Material, technical: EKPO-MATNR, meaning: Qué compras.}
  - {label: Centro (Plant), technical: EKPO-WERKS, meaning: Dónde se recibe.}
tables:
  - {name: EKKO, description: Cabecera del documento de compras (pedido).}
  - {name: EKPO, description: Posiciones del documento de compras.}
  - {name: EKET, description: Repartos (fechas y cantidades de entrega).}
  - {name: EKKN, description: Imputación (centro de coste, etc.) en documentos de compras.}
  - {name: EKBE, description: Historial del pedido (entradas de mercancía, facturas).}
  - {name: LFA1, description: Datos generales del proveedor.}
common_errors:
  - error: SAP pide un centro de coste u otra imputación.
    meaning: La posición tiene un tipo de imputación (por ejemplo K = centro de coste) que exige ese dato.
    what_to_do: Escribe el centro de coste correcto o pregúntale a tu área cuál usar.
    verified: false
  - error: El proveedor está bloqueado o no está creado para tu organización de compras.
    meaning: Falta ampliar el proveedor a tu organización de compras, o compras lo bloqueó.
    what_to_do: Pide al equipo de datos maestros que lo revise (en S/4HANA, con la transacción BP).
    verified: false
  - error: El material no está creado en el centro.
    meaning: El material no tiene datos para ese centro.
    what_to_do: Revisa el centro o pide ampliar el material (MM01).
    verified: false
  - error: Sale un aviso de que no hay precio.
    meaning: No hay registro info ni contrato con precio para ese proveedor y material.
    what_to_do: Escribe el precio a mano si tu empresa lo permite, o pide que se cree el registro info.
    verified: false
verification:
  status: verificado
  sin_verificar:
    - "Campos técnicos EKKO-LIFNR y EKPO-MATNR/EKPO-WERKS: no aparecen literalmente en las páginas revisadas."
