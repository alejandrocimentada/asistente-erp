  - {title: "SAP Help (ERP): Reporting in Purchasing (ME2L Purchasing Documents per Vendor)", url: "https://help.sap.com/docs/SAP_ERP/349992fb60854a62a264d716ad5c8f54/a1e5e052427c9d36e10000000a44538d.html"}
  - {title: "SAP Help (S/4HANA Cloud 2608): Monitor Purchase Order Items (F2358)", url: "https://help.sap.com/docs/SAP_S4HANA_CLOUD/ee9ee0ca4c3942068ea584d2f929b5b1/b992de09d8574e38bf6bda87472266e0.html?version=2608.00"}
  - {title: "SAP Support Content: Commonly Used Tables in Purchasing", url: "https://help.sap.com/docs/SUPPORT_CONTENT/spmm/3362168418.html"}
